
<!DOCTYPE html>
<html>
<head>
    <title>My Form</title>
</head>
<body>

    <h1>My Registration Form</h1>

    <form id="form">

        Student Name:
        <input type="text" id="name" placeholder="Enter Name" required>
        <br><br>

        Student Email:
        <input type="email" id="email" placeholder="Enter Email" required>
        <br><br>

        Student Course:
        <input type="text" id="course" placeholder="Enter Course" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>

    <script>
    document.getElementById("form").onsubmit = function(e) {

        e.preventDefault();

        var data = new FormData();

        data.append("name", document.getElementById("name").value);
        data.append("email", document.getElementById("email").value);
        data.append("course", document.getElementById("course").value);

        fetch("https://script.google.com/macros/s/AKfycby1MDrYSQQDefaMVUZQI-7f55znO7EgYvEImRbfzj8yIgTvtiMYfyjw91n5RLdBZWFR/exec", {
            method: "POST",
            body: data
        })
        .then(response => response.text())
        .then(result => {
            alert("Student Registered!");
            document.getElementById("form").reset();
        })
        .catch(error => {
            alert("Something went wrong!");
        });

    };
    </script>

</body>
</html>
